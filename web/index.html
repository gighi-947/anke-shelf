<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安科书架</title>
  <link rel="stylesheet" href="/css/style.css?v=20260820">
  <link rel="stylesheet" href="/css/reader.css?v=20260820">
</head>
<body>
  <!-- ============ 书架视图 ============ -->
  <div id="shelf-view" class="view">
    <header class="toolbar shelf-toolbar">
      <div class="shelf-brand">
        <span class="app-logo">
          <svg class="icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-books"></use></svg>
        </span>
        <h1 class="app-title">安科书架</h1>
      </div>
      <div class="shelf-search">
        <span class="shelf-search-icon">
          <svg class="icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-search"></use></svg>
        </span>
        <input id="shelf-search" type="text" placeholder="搜索书籍…" autocomplete="off" spellcheck="false">
      </div>
      <div class="toolbar-actions">
        <button id="nga-download-btn" class="btn btn-ghost" title="下载安科">
          <svg class="icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-download"></use></svg>
          下载安科
        </button>
        <button id="floor-export-btn" class="btn btn-ghost" title="楼层导出">
          <svg class="icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-image"></use></svg>
          楼层导出
        </button>
        <button id="theme-btn" class="btn btn-ghost icon-btn" title="切换主题"></button>
        <button id="settings-btn" class="btn btn-ghost icon-btn" title="设置">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-gear"></use></svg>
        </button>
        <button id="import-btn" class="btn btn-ghost icon-btn" title="导入书籍">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-plus"></use></svg>
        </button>
      </div>
    </header>

    <div id="shelf-controls" class="shelf-controls">
      <div id="recent-strip" class="recent-strip hidden"></div>
      <div class="shelf-view-options">
        <select id="shelf-sort" class="shelf-sort" title="书架排序">
          <option value="recent">最近阅读</option>
          <option value="title">书名</option>
          <option value="author">作者</option>
          <option value="added">添加时间</option>
        </select>
        <div class="shelf-view-toggle" role="group" aria-label="书架视图">
          <button id="shelf-view-grid" class="shelf-view-btn active" title="网格视图">
            <svg class="icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
          <button id="shelf-view-list" class="shelf-view-btn" title="列表视图">
            <svg class="icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
        <button id="shelf-hide-brackets" class="shelf-view-btn" title="隐藏书名【安科】等前缀" aria-pressed="false">
          <svg class="icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20H4v-3"/><path d="M4 12h16"/><path d="M15 20h5v-3"/></svg>
        </button>
      </div>
    </div>

    <main id="book-grid" class="book-grid"></main>

    <div id="shelf-empty" class="empty-state hidden">
      <span class="empty-icon">
        <svg class="icon" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-books"></use></svg>
      </span>
      <h1>开始你的书库</h1>
      <p>导入本地 EPUB，或从骨碌碌、NGA 获取安科。</p>
      <div class="empty-actions">
        <button id="empty-import-btn" class="btn btn-primary">导入书籍</button>
        <button id="empty-nga-btn" class="btn btn-contrast">下载安科</button>
      </div>
    </div>
    <div id="shelf-no-match" class="shelf-no-match hidden">没有匹配的书籍</div>
  </div>

  <!-- ============ 阅读视图 ============ -->
  <div id="reader-view" class="view hidden">
    <!-- 浮动顶栏 -->
    <header id="top-bar" class="top-bar">
      <div class="header-tools-start">
        <button id="back-btn" class="top-btn" title="返回书架">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-library"></use></svg>
        </button>
        <button id="bookmark-btn" class="top-btn" title="添加书签">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-bookmark"></use></svg>
        </button>
        <button id="sidebar-toggle" class="top-btn" title="侧栏">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-sidebar"></use></svg>
        </button>
      </div>
      <div class="book-title-wrap">
        <span id="reader-book-title" class="reader-book-title"></span>
        <span id="reader-chapter-label" class="reader-chapter-label"></span>
      </div>
      <div class="top-actions">
        <button id="gululu-immersive-btn" class="top-btn hidden" title="音乐与氛围效果">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-music"></use></svg>
        </button>
        <button id="gululu-comments-btn" class="top-btn hidden" title="评论">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-chat"></use></svg>
        </button>
        <button id="search-page-btn" class="top-btn" title="全文搜索 (Ctrl+F)">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-search"></use></svg>
        </button>
        <button id="theme-btn2" class="top-btn" title="切换主题"></button>
        <button id="help-btn" class="top-btn" title="快捷键帮助 (?)">?</button>
        <button id="bars-pin-btn" class="top-btn" title="固定顶栏与底栏">
          <svg class="icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-pin"></use></svg>
        </button>
        <button id="fullscreen-btn" class="top-btn" title="沉浸式阅读（全屏）">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-expand"></use></svg>
        </button>
        <button id="view-menu-btn" class="top-btn" title="视图设置">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-dots"></use></svg>
        </button>
      </div>
    </header>

    <!-- 左侧栏 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="header-tools-start">
          <button id="sidebar-toggle2" class="top-btn" title="关闭侧栏">
            <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-sidebar"></use></svg>
          </button>
        </div>
        <div class="header-tools-end">
          <button id="sidebar-search-btn" class="top-btn" title="搜索">
            <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-search"></use></svg>
          </button>
          <button id="sidebar-pin-btn" class="top-btn sidebar-pin-btn" title="固定侧栏">
            <svg class="icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-pin"></use></svg>
          </button>
        </div>
      </div>

      <div id="sidebar-book-card" class="sidebar-book-card">
        <div id="sb-cover" class="sb-cover"></div>
        <div class="sb-meta">
          <div id="sb-title" class="sb-title"></div>
          <div id="sb-sub" class="sb-sub"></div>
        </div>
      </div>

      <div class="sidebar-body">
        <div id="tab-toc" class="tab-panel active"><nav id="toc-tree" class="toc-tree"></nav></div>
        <div id="tab-bookmarks" class="tab-panel">
          <div id="bookmark-list" class="side-list"><p class="muted side-empty">暂无书签</p></div>
        </div>
        <div id="tab-annotations" class="tab-panel">
          <div id="annotation-list" class="side-list"><p class="muted side-empty">暂无标注</p></div>
        </div>
        <div id="tab-stats" class="tab-panel"></div>
      </div>

      <div class="sidebar-tabs">
        <button class="tab-btn active" data-tab="toc" title="目录">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-toc"></use></svg>
          <span class="tab-label">目录</span>
        </button>
        <button class="tab-btn" data-tab="bookmarks" title="书签">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-bookmark"></use></svg>
          <span class="tab-label">书签</span>
        </button>
        <button class="tab-btn" data-tab="annotations" title="标注">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-note"></use></svg>
          <span class="tab-label">标注</span>
        </button>
        <button class="tab-btn" data-tab="stats" title="阅读统计">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-stats"></use></svg>
          <span class="tab-label">统计</span>
        </button>
      </div>
    </aside>

    <!-- 阅读舞台 -->
    <div id="reader-root" aria-busy="false">
      <div id="gululu-background-layer" class="gululu-background-layer" aria-hidden="true"></div>
      <canvas id="gululu-vfx-canvas" class="gululu-vfx-canvas" aria-hidden="true"></canvas>
      <div id="chapter-scroll" class="chapter-scroll">
        <div class="chapter-wrap">
          <iframe id="chapter-frame" class="chapter-frame" title="章节内容"></iframe>
          <div class="chapter-nav-row">
            <button id="prev-chapter" class="btn"><svg class="icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-prev"></use></svg> 上一章</button>
            <button id="next-chapter" class="btn">下一章 <svg class="icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-next"></use></svg></button>
          </div>
        </div>
      </div>
      <div id="page-nav-left" class="page-nav page-nav-left">
        <button class="page-nav-btn" data-action="prev-section" title="上一章">
          <svg class="icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-double-prev"></use></svg>
        </button>
        <button class="page-nav-btn" data-action="prev" title="上一页">
          <svg class="icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-prev"></use></svg>
        </button>
      </div>
      <div id="page-nav-right" class="page-nav page-nav-right">
        <button class="page-nav-btn" data-action="next" title="下一页">
          <svg class="icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-next"></use></svg>
        </button>
        <button class="page-nav-btn" data-action="next-section" title="下一章">
          <svg class="icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-double-next"></use></svg>
        </button>
      </div>
      <div id="ruler" class="ruler hidden"></div>
      <div id="brightness-overlay" class="brightness-overlay hidden"></div>
      <div id="rsvp-box" class="rsvp-box hidden"></div>
      <div id="paragraph-mask" class="paragraph-mask hidden"></div>
      <div id="dual-gutter" class="dual-gutter"></div>
      <div id="gululu-danmaku-layer" class="gululu-danmaku-layer" aria-hidden="true"></div>
      <div id="gululu-music-toast" class="gululu-music-toast hidden" role="status">
        <svg class="icon" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-music"></use></svg>
        <span id="gululu-music-toast-text">正在播放</span>
      </div>
      <div id="reader-loading-mask" class="reader-loading-mask hidden" role="status" aria-live="polite">
        <span>加载中…</span>
      </div>
    </div>

    <aside id="gululu-comments-panel" class="gululu-comments-panel hidden" aria-label="骨碌碌评论">
      <header class="gululu-comments-header">
        <div>
          <h2>评论</h2>
          <p id="gululu-comments-status">按当前章节在线加载</p>
        </div>
        <div class="gululu-comments-actions">
          <button id="gululu-comments-refresh" class="top-btn" title="刷新评论">
            <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-refresh"></use></svg>
          </button>
          <button id="gululu-comments-close" class="top-btn" title="关闭评论">
            <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-close"></use></svg>
          </button>
        </div>
      </header>
      <div class="gululu-comments-toolbar">
        <label class="gululu-switch">
          <input id="gululu-danmaku-toggle" type="checkbox">
          <span class="gululu-switch-track" aria-hidden="true"></span>
          <span>弹幕</span>
        </label>
      </div>
      <div id="gululu-comments-list" class="gululu-comments-list" aria-live="polite"></div>
    </aside>

    <aside id="gululu-immersive-panel" class="gululu-immersive-panel hidden" aria-label="音乐与氛围效果">
      <header class="gululu-comments-header">
        <div>
          <h2>音乐与氛围</h2>
          <p id="gululu-immersive-status">等待正文触发</p>
        </div>
        <button id="gululu-immersive-close" class="top-btn" title="关闭音乐与氛围面板">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div class="gululu-immersive-controls">
        <label class="gululu-control-row" id="gululu-auto-music-row">
          <span id="gululu-auto-music-label">自动音乐</span>
          <span class="gululu-switch"><input id="gululu-auto-music-toggle" type="checkbox"><span class="gululu-switch-track" aria-hidden="true"></span></span>
        </label>
        <label class="gululu-control-row" id="gululu-background-row">
          <span>氛围背景</span>
          <span class="gululu-switch"><input id="gululu-background-toggle" type="checkbox"><span class="gululu-switch-track" aria-hidden="true"></span></span>
        </label>
        <label class="gululu-control-row" id="gululu-vfx-row">
          <span>动态视效</span>
          <span class="gululu-switch"><input id="gululu-vfx-toggle" type="checkbox"><span class="gululu-switch-track" aria-hidden="true"></span></span>
        </label>
        <label class="gululu-volume-row" for="gululu-volume">
          <span>音乐音量</span>
          <input id="gululu-volume" type="range" min="0" max="100" step="5">
        </label>
        <div class="gululu-music-progress-row">
          <span>播放进度</span>
          <input id="gululu-music-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="音乐进度">
        </div>
        <button id="gululu-music-toggle" class="btn gululu-music-toggle" type="button">
          <svg class="icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-play"></use></svg>
          <span>播放</span>
        </button>
        <button id="gululu-stop-music" class="btn gululu-stop-music" type="button">
          <svg class="icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-stop"></use></svg>
          <span>停止音乐</span>
        </button>
      </div>
    </aside>

    <aside id="gululu-overview-panel" class="gululu-overview-panel hidden" aria-label="沉浸内容总览">
      <header class="gululu-comments-header">
        <div>
          <h2>沉浸内容总览</h2>
          <p id="gululu-overview-status">本章音乐 / 背景 / 视效 / 阅读解锁</p>
        </div>
        <button id="gululu-overview-close" class="top-btn" title="关闭总览">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div class="gululu-overview-tabs" role="tablist" aria-label="总览视图">
        <button class="gululu-overview-tab active" type="button" role="tab" data-view="floor" aria-selected="true">按楼层</button>
        <button class="gululu-overview-tab" type="button" role="tab" data-view="type" aria-selected="false">按类型</button>
      </div>
      <div id="gululu-overview-list" class="gululu-overview-list"></div>
    </aside>

    <div id="gululu-quick-shell" class="gululu-quick-shell hidden">
      <div id="gululu-quick-menu" class="gululu-quick-menu hidden" role="menu" aria-label="更多操作">
        <button id="gululu-quick-fullscreen" class="gululu-quick-command" type="button" role="menuitem">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-expand"></use></svg>
          <span>全屏</span>
        </button>
        <button id="gululu-reset-dice-chapter" class="gululu-quick-command" type="button" role="menuitem">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-dice"></use></svg>
          <span>重置本章骰点揭示</span>
        </button>
        <button id="gululu-reset-dice-all" class="gululu-quick-command" type="button" role="menuitem">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-dice"></use></svg>
          <span>重置全书骰点揭示</span>
        </button>
        <button id="gululu-reset-secrets-chapter" class="gululu-quick-command" type="button" role="menuitem">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-trash"></use></svg>
          <span>重置本章秘密线索</span>
        </button>
        <button id="gululu-reset-secrets-all" class="gululu-quick-command" type="button" role="menuitem">
          <svg class="icon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><use href="#i-trash"></use></svg>
          <span>重置全书秘密线索</span>
        </button>
      </div>
      <nav id="gululu-quick-actions" class="gululu-quick-actions" aria-label="骨碌碌快捷操作">
