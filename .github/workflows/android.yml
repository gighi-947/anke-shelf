name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - 'assets/**'
      # 双端共享契约：Android 侧消费 contracts/fixtures（如 native-book/append-cases.json
      # 由 NativeAppendFixtureTest 消费）。改夹具若不触发本工作流，Android 端就会
      # 带着过期的期望值继续通过——共享契约变更必须两端同时验证。
      - 'contracts/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'assets/**'
      - 'contracts/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate reader JS syntax and exports
        run: node --check app/src/main/assets/reader/reader-lite.js
      - name: Validate reader-lite.js equals parts bundle
        run: node scripts/bundle-reader-lite.js
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      # release 构建路径验证：R8/ProGuard 规则错误此前只在发版当天暴露
      # （正式签名缺失使 release 从未在 CI 跑过）。这里用一次性临时签名，
      # 只为验证 isMinifyEnabled + shrinkResources + proguard-rules.pro 能跑通；
      # 产物不发布，密钥当场销毁。
      - name: Generate throwaway signing config
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore ci-throwaway.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 1 \
            -storepass ci-throwaway -keypass ci-throwaway \
            -alias ci-throwaway \
            -dname "CN=CI Throwaway, OU=CI, O=AnkeShelf, L=NA, ST=NA, C=NA"
          printf '%s\n' \
            'storeFile=ci-throwaway.jks' \
            'storePassword=ci-throwaway' \
            'keyAlias=ci-throwaway' \
            'keyPassword=ci-throwaway' > keystore.properties

      - name: Assemble release APK (R8/ProGuard guard)
        run: ./gradlew assembleRelease

      - name: Verify R8 actually ran
        run: |
          set -euo pipefail
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ ! -s "$mapping" ]; then
            echo "::error::mapping.txt missing or empty -> R8/minify did not run"
            exit 1
          fi
          echo "mapping.txt $(wc -c < "$mapping") bytes -> minifyEnabled+shrink verified"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Remove throwaway signing material
        if: always()
        run: rm -f keystore.properties ci-throwaway.jks

      - uses: actions/upload-artifact@v7
        with:
          name: ankeshelf-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 真机/模拟器回归：此前双实现一致性（Kotlin PagedLayout ↔ JS reader-lite.js）
  # 只靠人工手跑，改渲染后无法自动发现漂移。
  # 分级策略：PR 走上面的快反馈 job（JVM + release 构建），
  # 合入 main 与手动触发时才跑 instrumentation（模拟器启动较慢）。
  instrumented:
    name: Instrumented tests (API 26)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # 必须用 ubuntu（有 KVM 硬件加速）。不可用 macos-latest：现为 Apple Silicon
    # (ARM64)，而 API 26 只有 x86_64 镜像，ARM Mac 上无法硬件加速启动，
    # 实测直接 "Timeout waiting for emulator to boot"。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6

      # 启用 KVM 组权限，否则模拟器回退到软件渲染、启动极慢乃至超时。
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 26 = minSdk：覆盖最老受支持版本，最能暴露 WebView / 存储行为差异。
      - name: Run instrumented tests on emulator
        id: instrumented
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          # 冷启动偶发抖动（首次需下载系统镜像），给一次重试。
          # 重试前清理，避免残留 AVD 占用端口 5554。
          emulator-boot-timeout: 600
          working-directory: android
          # 只跑需要真实 WebView 的跨端对照套件（Kotlin PagedLayout ↔
          # JS reader-lite.js 双实现漂移），避免全套 UI 测试拖长反馈。
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.gighi947.ankeshelf.ui.reader.ReaderPagedCrossTest

      # 模拟器冷启动偶发失败（端口未就绪/镜像下载慢），失败重试一次。
      # 仅在首次失败时重试，第二次仍失败则如实判红，不掩盖真实回归。
      - name: Retry instrumented tests once on emulator flake
        if: failure() && steps.instrumented.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 600
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.gighi947.ankeshelf.ui.reader.ReaderPagedCrossTest

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-report
          path: android/app/build/reports/androidTests/connected
