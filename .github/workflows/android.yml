name: Android CI

on:
  push:
    paths:
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'assets/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate reader JS syntax and exports
        run: node --check app/src/main/assets/reader/reader-lite.js
      - name: Validate reader-lite.js equals parts bundle
        run: node scripts/bundle-reader-lite.js
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ankeshelf-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
