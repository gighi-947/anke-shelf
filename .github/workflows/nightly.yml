name: Nightly Windows checks

on:
  schedule:
    # 北京时间 04:00（UTC 20:00）——性能基准与安全回归，不阻塞普通 PR
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-nightly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.lock
      - name: Full unit tests (incl. security regression)
        run: python -m unittest discover tests
      - name: Dependency audit (advisory, 不阻塞)
        # 依赖漏洞审计基线：发现即在 nightly 汇总中可见，不使流水线失败；
        # 修复经 Dependabot PR / 手动升级跟踪（Dependabot alerts 已开启）。
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock
      - name: Performance benchmark
        run: python -m tests.performance.bench
      - uses: actions/upload-artifact@v7
        with:
          name: windows-performance-baseline
          path: tests/performance/baseline.json
