name: Windows CI

on:
  push:
    paths:
      - 'app/**'
      - 'web/**'
      - 'ngapost2md-python/**'
      - 'tests/**'
      - 'contracts/**'
      - 'requirements*'
      - 'ankeshelf.spec'
      - 'run_app.py'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'web/**'
      - 'ngapost2md-python/**'
      - 'tests/**'
      - 'contracts/**'
      - 'requirements*'
      - 'ankeshelf.spec'
      - 'run_app.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.lock -r requirements-build.lock

      - name: Validate frontend JS syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem web/js -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Contract JS tests (textpos + reader-session)
        run: |
          node contracts/tests/textpos.test.js
          node tests/js/reader-session.test.js

      - name: Unit tests
        run: python -m unittest discover tests

      - name: Build Windows package (PyInstaller)
        if: matrix.python-version == '3.12'
        run: python -m PyInstaller --noconfirm --clean ankeshelf.spec

      - name: Bundle docs and create directory release zip
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath README.md, LICENSE, web/fonts/OFL.txt, 使用说明.txt -Destination dist\AnkeShelf -Force
          $ver = python -c "import app; print(app.__version__)"
          Compress-Archive -Path dist\AnkeShelf -DestinationPath "dist\AnkeShelf-v$ver.zip" -CompressionLevel Optimal -Force
          Write-Output "package=AnkeShelf-v$ver.zip"

      - name: Generate release manifest
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\AnkeShelf-v*.zip | Select-Object -First 1
          $ver = python -c "import app; print(app.__version__)"
          python scripts/release_manifest.py --version $ver --zip $zip.FullName --out "dist\AnkeShelf-v$ver.release.txt"
          Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256 | ForEach-Object { "zip_sha256=$($_.Hash)" } | Set-Content -Encoding ASCII "dist\AnkeShelf-v$ver.zip.sha256"
      - uses: actions/upload-artifact@v5
        if: matrix.python-version == '3.12'
        with:
          name: ankeshelf-windows-package
          path: dist/AnkeShelf-v*
