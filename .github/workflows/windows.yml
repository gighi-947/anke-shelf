name: Windows CI

on:
  push:
    paths:
      - 'app/**'
      - 'web/**'
      - 'ngapost2md-python/**'
      - 'tests/**'
      - 'contracts/**'
      - 'requirements*'
      - 'ankeshelf.spec'
      - 'run_app.py'
      - 'assets/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'web/**'
      - 'ngapost2md-python/**'
      - 'tests/**'
      - 'contracts/**'
      - 'requirements*'
      - 'ankeshelf.spec'
      - 'run_app.py'
      - 'assets/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.lock -r requirements-build.lock

      - name: Validate frontend JS syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem web/js -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Clean stale bytecode
        # 孤儿 .pyc（源文件已删、字节码残留）会被 unittest discover 导入。
        # 若残留的是调试探针等"故意失败"的模块，会让测试偶发失败且极难定位
        # （实测出现过 1/15 概率的假红）。CI 每次从干净 checkout 开始本不会遇到，
        # 但本地复跑会；统一清理以保证本地与 CI 结果一致。
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter "__pycache__" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Output "pycache cleaned"

      - name: JS guard tests (auto-discovered)
        # 自动发现：新增 tests/js/*.test.js 与 contracts/tests/*.test.js 自动纳入，
        # 无需改 CI（此前人工列举导致 reader-save / paged-blank 等守卫漏跑）。
        shell: pwsh
        run: |
          $failed = @()
          $tests = @()
          $tests += Get-ChildItem tests/js -Filter *.test.js -File
          $tests += Get-ChildItem contracts/tests -Filter *.test.js -File
          if ($tests.Count -eq 0) { throw "no JS guard tests discovered" }
          foreach ($t in $tests) {
            Write-Output "--- $($t.FullName)"
            node $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) { throw "failing JS guard tests: $($failed -join ', ')" }
          Write-Output "ran $($tests.Count) JS guard tests"

      - name: Unit tests
        run: python -m unittest discover tests

      - name: Build Windows package (PyInstaller)
        if: matrix.python-version == '3.12'
        run: python -m PyInstaller --noconfirm --clean ankeshelf.spec

      - name: Bundle docs and create directory release zip
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath README.md, LICENSE, assets/fonts/OFL.txt, 使用说明.txt -Destination dist\AnkeShelf -Force
          $ver = python -c "import app; print(app.__version__)"
          Compress-Archive -Path dist\AnkeShelf -DestinationPath "dist\AnkeShelf-v$ver.zip" -CompressionLevel Optimal -Force
          Write-Output "package=AnkeShelf-v$ver.zip"

      - name: Generate release manifest
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\AnkeShelf-v*.zip | Select-Object -First 1
          $ver = python -c "import app; print(app.__version__)"
          python scripts/release_manifest.py --version $ver --zip $zip.FullName --out "dist\AnkeShelf-v$ver.release.txt"
          Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256 | ForEach-Object { "zip_sha256=$($_.Hash)" } | Set-Content -Encoding ASCII "dist\AnkeShelf-v$ver.zip.sha256"
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: ankeshelf-windows-package
          path: dist/AnkeShelf-v*
