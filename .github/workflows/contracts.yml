name: Contracts CI

on:
  push:
    paths:
      - 'contracts/**'
      - 'app/api/**'
      - 'web/js/api-client.js'
      - 'web/js/bridge.js'
      - 'web/js/textpos.js'
      - 'android/app/src/main/assets/reader/**'
      - 'android/app/src/main/java/io/github/gighi947/ankeshelf/data/NgaTocParser.kt'
      - 'ngapost2md-python/ngapost2md/toc.py'
      - 'tests/test_contracts.py'
      - 'tests/test_api_contract.py'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'app/api/**'
      - 'web/js/api-client.js'
      - 'web/js/bridge.js'
      - 'web/js/textpos.js'
      - 'android/app/src/main/assets/reader/**'
      - 'android/app/src/main/java/io/github/gighi947/ankeshelf/data/NgaTocParser.kt'
      - 'ngapost2md-python/ngapost2md/toc.py'
      - 'tests/test_contracts.py'
      - 'tests/test_api_contract.py'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: pip install jsonschema
      - name: Node API manifest comparison and launch diagnostics
        run: |
          node contracts/tests/api-contract.test.js
          node contracts/tests/api-contract-launch.test.js
      - name: Node textpos contract（含 Android reader-lite 跨端折叠对照）
        run: |
          node contracts/tests/textpos.test.js
          node contracts/tests/reader-lite-textpos.test.js
          node contracts/tests/reader-lite-parts.test.js
      - name: Python contract and API contract tests
        run: python -m unittest tests.test_api_contract tests.test_contracts
