name: Contracts CI

# 目录级触发（非逐文件白名单）：此前白名单式 paths 会随新增跨端文件静默失效
# （新增一个双端对应文件却忘了往列表里加 = 守卫静默缺失）。
# 代价是 `app/**`、`web/**`、`android/**` 任一改动都会跑契约套件（约 1 分钟），
# 换来的是"永不漏守卫"。测试自身不依赖构建产物。
on:
  push:
    paths:
      - 'contracts/**'
      - 'app/**'
      - 'web/**'
      - 'ngapost2md-python/**'
      - 'android/app/src/main/assets/reader/**'
      - 'android/app/src/main/java/**'
      - 'tests/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'app/**'
      - 'web/**'
      - 'ngapost2md-python/**'
      - 'android/app/src/main/assets/reader/**'
      - 'android/app/src/main/java/**'
      - 'tests/**'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install contract test dependencies
        run: pip install jsonschema==4.26.0 httpx==0.28.1 cryptography==49.0.0
      - name: Node API manifest comparison and launch diagnostics
        run: |
          node contracts/tests/api-contract.test.js
          node contracts/tests/api-contract-launch.test.js
      - name: Node textpos contract（含 Android reader-lite 跨端折叠对照）
        run: |
          node contracts/tests/textpos.test.js
          node contracts/tests/reader-lite-textpos.test.js
          node contracts/tests/reader-lite-parts.test.js
      - name: Python contract and API contract tests
        run: python -m unittest tests.test_api_contract tests.test_contracts
